name: USD-CNY Recovery Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recovery_once.yml'

permissions:
  contents: write

concurrency:
  group: usd-cny-daily-xizhi
  cancel-in-progress: false

jobs:
  daily-push:
    if: ${{ github.event.head_commit.message == 'Recover missed daily notifications 20261031-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore daily price history
        id: history
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .state/usd-cny-history.json
          key: usd-cny-sell-history-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            usd-cny-sell-history-v1-${{ github.ref_name }}-
      - name: Send today's missed exchange-rate report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XZKEY: ${{ secrets.XZKEY }}
          FORCE_SEND: 'false'
        run: python delivery_schedule.py --start 08:00 --end 18:00 -- python usd_cny_daily.py --history-file .state/usd-cny-history.json
      - name: Save daily price history
        if: ${{ always() && steps.history.outcome == 'success' && hashFiles('.state/usd-cny-history.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .state/usd-cny-history.json
          key: ${{ steps.history.outputs.cache-primary-key }}
