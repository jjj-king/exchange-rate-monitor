name: USD-CNY Daily XiZhi

on:
  schedule:
    # UTC 01:00 = 北京时间每天09:00；GitHub定时任务可能延迟。
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅预览，不发送通知、不写入历史'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: usd-cny-daily-xizhi
  cancel-in-progress: false

jobs:
  daily-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Restore daily purchase rate history
        id: history
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .state/usd-cny-history.json
          key: usd-cny-sell-history-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            usd-cny-sell-history-v1-${{ github.ref_name }}-

      - name: Preview purchase rate report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python usd_cny_daily.py --dry-run --history-file .state/usd-cny-history.json

      - name: Fetch USD rates and send daily message
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          XZKEY: ${{ secrets.XZKEY }}
        run: python usd_cny_daily.py --history-file .state/usd-cny-history.json

      - name: Save daily purchase rate history
        if: ${{ always() && steps.history.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && hashFiles('.state/usd-cny-history.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .state/usd-cny-history.json
          key: ${{ steps.history.outputs.cache-primary-key }}
