name: USD-CNY Daily XiZhi

on:
  schedule:
    - cron: '17 * * * *' # 每小时检查一次；实际发送受北京时间窗口和日期去重控制。
  workflow_dispatch:
    inputs:
      force:
        description: '忽略今日已发送标记，明确额外发送一次'
        type: boolean
        required: false
        default: false
      dry_run:
        description: '仅预览，不发送通知、不写入历史或发送标记'
        type: boolean
        required: false
        default: false

permissions:
  contents: write # 仅用于daily-delivery-state分支的每日发送标记。

concurrency:
  group: usd-cny-daily-xizhi
  cancel-in-progress: false

jobs:
  daily-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check actual Beijing delivery window
        id: window
        run: python delivery_schedule.py --start 09:00 --end 12:00 --check-window
      - name: Set up Python
        if: ${{ steps.window.outputs.allowed == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore daily price history
        if: ${{ steps.window.outputs.allowed == 'true' }}
        id: history
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .state/usd-cny-history.json
          key: usd-cny-sell-history-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            usd-cny-sell-history-v1-${{ github.ref_name }}-
      - name: Preview report without sending
        if: ${{ steps.window.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python usd_cny_daily.py --dry-run --history-file .state/usd-cny-history.json
      - name: Send one daily report in its delivery window
        if: ${{ steps.window.outputs.allowed == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XZKEY: ${{ secrets.XZKEY }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python delivery_schedule.py --start 09:00 --end 12:00 -- python usd_cny_daily.py --history-file .state/usd-cny-history.json
      - name: Save daily price history
        if: ${{ always() && steps.history.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && hashFiles('.state/usd-cny-history.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .state/usd-cny-history.json
          key: ${{ steps.history.outputs.cache-primary-key }}
